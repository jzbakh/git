name: CI

on: [push]

jobs:
  phcm:
    name: default placeholder mode and inheritance, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: build with MSVC, copy under several names
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        @("call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >NUL || exit /b 1",
          'cl /nologo /W3 probe\phcm.c /Fe:phcm.exe || exit /b 1') |
          Set-Content -Encoding ascii build.bat
        cmd /c build.bat
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        New-Item -ItemType Directory names | Out-Null
        foreach ($n in 'git.exe', 'python.exe', 'pwsh.exe', 'powershell.exe',
                       'cmd.exe', 'explorer.exe', 'code.exe', 'bash.exe',
                       'OneDrive.exe', 'phcm.exe') {
          Copy-Item phcm.exe "names\$n"
        }
    - name: from cmd
      shell: cmd
      run: |
        for %%n in (names\*.exe) do %%n
        names\git.exe child 0
        names\git.exe child 1
        names\git.exe child 2
    - name: from Windows PowerShell 5.1
      shell: powershell
      run: |
        Get-ChildItem names\*.exe | ForEach-Object { & $_.FullName }
        foreach ($m in 0, 1, 2) { & .\names\git.exe child $m }
    - name: from PowerShell 7
      shell: pwsh
      run: |
        Get-ChildItem names\*.exe | ForEach-Object { & $_.FullName }
        foreach ($m in 0, 1, 2) { & .\names\git.exe child $m }
    - name: from Git Bash
      shell: bash
      run: |
        for n in names/*.exe; do "./$n"; done
        for m in 0 1 2; do ./names/git.exe child $m; done

  attrs:
    name: attributes per API and placeholder mode
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: build with MSVC
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        @("call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >NUL || exit /b 1",
          'cl /nologo /W3 probe\cfprobe.c /Fe:cfprobe.exe || exit /b 1',
          'cl /nologo /W3 probe\phattr.c /Fe:phattr.exe || exit /b 1') |
          Set-Content -Encoding ascii build.bat
        cmd /c build.bat
        exit $LASTEXITCODE
    - name: regular file, synced placeholder, freed placeholder
      shell: bash
      run: |
        W=$(cygpath -u "$GITHUB_WORKSPACE")
        waitfor () {
          t=0
          while [ $t -lt 90 ] && ! grep -q "^$1\$" /c/cfa.log 2>/dev/null
          do
            sleep 1
            t=$((t + 1))
          done
        }
        mkdir -p /c/plain /c/cfa
        printf 'x\n' >/c/plain/f1
        printf 'one\n' >/c/cfa/f1
        printf 'two\n' >/c/cfa/f2
        echo "regular file:"
        "$W/phattr.exe" 'C:\plain' f1
        "$W/cfprobe.exe" 'C:\cfa' 20 f1 f2 >/c/cfa.log 2>&1 &
        waitfor READY1
        echo "synced placeholder:"
        "$W/phattr.exe" 'C:\cfa' f1
        : >/c/cfa/go
        waitfor READY2
        echo "after Free up space:"
        "$W/phattr.exe" 'C:\cfa' f1
        wait || echo "cfprobe exited with $?"
        echo "provider log:"
        cat /c/cfa.log
