name: CI

on: [push]

jobs:
  slices:
    name: time each test of a stalled slice (${{ matrix.ref }}, slice ${{ matrix.slice }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: changetime-ctime-v4-c2
            slice: 1
          - ref: changetime-ctime-v3-ci
            slice: 7
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ matrix.ref }}
    - uses: git-for-windows/setup-git-for-windows-sdk@v2
    - name: build
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: . /etc/profile && make -j$NUMBER_OF_PROCESSORS NO_RUST=1 >/dev/null && git log -1 --format='%h %s'
    - name: run the slice as CI does, printing each test as it ends
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: |
        . /etc/profile
        export DEFAULT_TEST_TARGET=prove GIT_TEST_CLONE_2GB=true
        export GIT_PROVE_OPTS='--timer --jobs 10'
        export GIT_TEST_OPTS='--verbose-log -x --no-chain-lint --no-bin-wrappers'
        TESTS=$(cd t && ./helper/test-tool path-utils slice-tests ${{ matrix.slice }} 10 t[0-9]*.sh)
        echo "$(echo $TESTS | wc -w) tests; timeout: $(command -v timeout || echo missing)"
        set +e
        timeout 2400 make --quiet -C t T="$(echo $TESTS)" >/tmp/prove.txt 2>&1
        echo "make exit code: $?"
        grep -E '^\[[0-9:]+\] t[0-9]' /tmp/prove.txt | sort -t' ' -k1,1 | tail -5
        echo "slowest:"
        grep -E '^\[[0-9:]+\] t[0-9]' /tmp/prove.txt | sed -n 's/.* \([0-9]*\) ms .*/\1 &/p' | sort -n | tail -5
        echo "tests that did not finish:"
        for t in $TESTS; do grep -q "\] $t " /tmp/prove.txt || echo "  $t"; done
        echo "failures:"
        grep -E 'Failed|not ok|Dubious' /tmp/prove.txt | head -20 || true
        tail -5 /tmp/prove.txt
