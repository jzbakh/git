name: CI

on: [push]

jobs:
  cloudfiles:
    name: cloud files, rule ${{ matrix.rule }}
    strategy:
      fail-fast: false
      matrix:
        rule: [B, Bp]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: python
      shell: pwsh
      run: |
        $exe = python -c "import sys; print(sys.executable)"
        "PYEXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: build cfprobe with MSVC
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        @("call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >NUL || exit /b 1",
          'cl /nologo /W3 probe\cfprobe.c /Fe:cfprobe.exe || exit /b 1') |
          Set-Content -Encoding ascii build-cf.bat
        cmd /c build-cf.bat
        exit $LASTEXITCODE
    - uses: git-for-windows/setup-git-for-windows-sdk@v2
    - name: apply rule ${{ matrix.rule }}
      shell: bash
      run: |
        case "${{ matrix.rule }}" in
        B) git apply probe/rule-b.patch;;
        Bp) git apply probe/rule-bp.patch;;
        esac && git diff --stat
    - name: build
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: . /etc/profile && make -j$(nproc) NO_RUST=1 NO_PERL=1
    - name: OneDrive-like placeholders
      shell: bash
      env:
        HOME: ${{ runner.temp }}
      run: . /etc/profile && sh probe/cloudfiles.sh
    - name: provider logs
      if: always()
      shell: bash
      run: for f in /c/cf-*.log; do echo "== $f"; grep -v "^  repo.f00[1-9]" "$f"; done
