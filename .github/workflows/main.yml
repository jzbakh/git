name: CI

on: [push]

jobs:
  volumes:
    name: volumes and tunneling
    runs-on: windows-latest
    steps:
    - name: "volumes and tunneling on C: and D:"
      shell: pwsh
      run: |
        Get-Volume -DriveLetter C,D | Format-Table DriveLetter,FileSystemType,FileSystemLabel,Size
        Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' |
          Select-Object MaximumTunnelEntries,MaximumTunnelEntryAgeInSeconds,NtfsDisable8dot3NameCreation | Format-List
        foreach ($d in 'C:\tunnel-probe', (Join-Path $env:RUNNER_TEMP 'tunnel-probe')) {
          New-Item -ItemType Directory -Force $d | Out-Null
          $f = Join-Path $d 'f0000'
          Set-Content $f 'one' -NoNewline
          $c1 = (Get-Item $f).CreationTimeUtc
          Start-Sleep -Seconds 2
          Remove-Item $f
          Set-Content $f 'two' -NoNewline
          $c2 = (Get-Item $f).CreationTimeUtc
          "{0}: creation kept after delete+recreate: {1}" -f $d, ($c1 -eq $c2)
        }
