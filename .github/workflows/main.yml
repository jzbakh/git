name: CI

on: [push]

jobs:
  fscheck:
    name: file systems, rule ${{ matrix.rule }}
    strategy:
      fail-fast: false
      matrix:
        rule: [A, B]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: python
      shell: pwsh
      run: |
        $exe = python -c "import sys; print(sys.executable)"
        "PYEXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: volumes, WinFsp memfs, rclone
      shell: pwsh
      run: ./probe/mount.ps1
    - uses: git-for-windows/setup-git-for-windows-sdk@v2
    - name: apply rule B
      if: matrix.rule == 'B'
      shell: bash
      run: git apply probe/rule-b.patch && git diff --stat
    - name: build
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: . /etc/profile && make -j$(nproc) NO_RUST=1 NO_PERL=1
    - name: per file system, Git 2.56 then this Git
      shell: bash
      env:
        HOME: ${{ runner.temp }}
      run: |
        . /etc/profile
        t=$(cygpath -u "$RUNNER_TEMP")
        smb="//localhost/${RUNNER_TEMP:0:1}\$${t#/?}/smb"
        set -- "C:=/c/fsc" "D:=$t/fsc" "FAT32=/f" "exFAT=/g" "ReFS=/h" \
          "NTFS-vhd=/n" "SMB=$smb" "memfs=/m" "rclone=/r"
        sh probe/fscheck.sh "/c/Program Files/Git/cmd/git.exe" "$@"
        sh probe/fscheck.sh "$(pwd)/bin-wrappers/git" "$@"
