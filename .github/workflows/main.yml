name: CI

on: [push]

jobs:
  slices:
    name: time each test of a stalled slice (${{ matrix.ref }}, slice ${{ matrix.slice }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: changetime-ctime-v4-c2
            slice: 1
          - ref: changetime-ctime-v3-ci
            slice: 7
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ matrix.ref }}
    - uses: git-for-windows/setup-git-for-windows-sdk@v2
    - name: build
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: . /etc/profile && make -j$NUMBER_OF_PROCESSORS NO_RUST=1 >/dev/null && git log -1 --format='%h %s'
    - name: run each test of the slice, with a 15-minute limit
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: |
        . /etc/profile
        cd t
        TESTS=$(./helper/test-tool path-utils slice-tests ${{ matrix.slice }} 10 t[0-9]*.sh)
        echo "$(echo $TESTS | wc -w) tests"
        run_one () {
          s=$(date +%s)
          timeout 900 sh "$1" --no-bin-wrappers --no-chain-lint >"/tmp/diag-$1.log" 2>&1
          rc=$?
          echo "$(( $(date +%s) - s ))s rc=$rc $1"
        }
        export -f run_one
        printf '%s\n' $TESTS | xargs -P 10 -I{} bash -c 'run_one {}' >/tmp/times.txt
        sort -n /tmp/times.txt | tail -15
        echo "not ok (rc != 0):"
        grep -v ' rc=0 ' /tmp/times.txt || echo "none"
        echo "longest: $(sort -n /tmp/times.txt | tail -1)"
