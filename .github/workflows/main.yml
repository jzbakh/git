name: CI

on: [push]

jobs:
  gitsees:
    name: what git.exe sees of placeholders; each cloud operation
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - name: build the probes with MSVC
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        @("call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >NUL || exit /b 1",
          'cl /nologo /W3 probe\cfprobe.c /Fe:cfprobe.exe || exit /b 1',
          'cl /nologo /W3 probe\cfstages.c /Fe:cfstages.exe || exit /b 1',
          'cl /nologo /W3 probe\phattr.c /Fe:phattr.exe || exit /b 1') |
          Set-Content -Encoding ascii build.bat
        cmd /c build.bat
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        New-Item -ItemType Directory names | Out-Null
        foreach ($n in 'git.exe', 'python.exe', 'phattr.exe') {
          Copy-Item phattr.exe "names\$n"
        }
    - name: each cloud operation, compared to the previous step
      shell: bash
      run: |
        mkdir -p /c/cfs
        printf 'stage\n' >/c/cfs/f
        ./cfstages.exe 'C:\cfs' f
    - uses: git-for-windows/setup-git-for-windows-sdk@v2
    - name: rule B, with what git.exe sees printed
      shell: bash
      run: |
        git apply probe/rule-b.patch &&
        git apply probe/git-attrs.patch &&
        git diff --stat
    - name: build
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: . /etc/profile && make -j$(nproc) NO_RUST=1 NO_PERL=1
    - name: what git.exe sees
      shell: bash
      env:
        HOME: ${{ runner.temp }}
      run: . /etc/profile && sh probe/gitsees.sh
