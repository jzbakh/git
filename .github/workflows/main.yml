name: CI

on: [push]

jobs:
  arch:
    name: ${{ matrix.arch }} build, imports, stat tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i686
            flavor: build-installers
            runner: windows-latest
          - arch: aarch64
            flavor: full
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: git-for-windows/setup-git-for-windows-sdk@v2
      with:
        flavor: ${{ matrix.flavor }}
        architecture: ${{ matrix.arch }}
    - name: build with release flags
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: |
        case "$MSYSTEM" in CLANG*) CC=clang;; *) CC=gcc;; esac
        echo "MSYSTEM=$MSYSTEM CC=$CC"
        $CC --version | head -n 1
        make -j$(nproc) CC=$CC NO_RUST=1 NO_PERL=1 all
    - name: imports of git.exe
      shell: bash
      run: |
        (objdump -p git.exe || llvm-objdump -p git.exe) |
        grep -E "DLL Name|NtQueryFullAttributesFile|RtlDosPathNameToNtPathName_U_WithStatus|GetFileInformationByHandleEx"
        ./git.exe version --build-options
    - name: stat-related tests
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: |
        cd t
        for t in t0010-racy-git.sh t1701-racy-split-index.sh \
          t2108-update-index-refresh-racy.sh \
          t7063-status-untracked-cache.sh t7508-status.sh \
          t7519-status-fsmonitor.sh
        do
          sh $t || exit 1
        done
    - name: compile the changed files with DEVELOPER=1
      if: always()
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: |
        case "$MSYSTEM" in CLANG*) CC=clang;; *) CC=gcc;; esac
        rm -f compat/mingw.o compat/win32/fscache.o
        make CC=$CC NO_RUST=1 NO_PERL=1 DEVELOPER=1 \
          compat/mingw.o compat/win32/fscache.o

  nano-server:
    name: Nano Server load and status
    runs-on: windows-2022
    env:
      DEVELOPER: 1
      WINDBG_DIR: "C:/Program Files (x86)/Windows Kits/10/Debuggers/x64"
      IMAGE: mcr.microsoft.com/powershell:nanoserver-ltsc2022
    steps:
      - uses: actions/checkout@v7
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
      - name: build Git
        shell: bash
        run: make -j15 NO_RUST=1 NO_PERL=1
      - name: pull nanoserver image
        shell: bash
        run: docker pull $IMAGE
      - name: run git.exe in Nano Server
        shell: bash
        run: |
          docker run \
            --user "ContainerAdministrator" \
            -v "$WINDBG_DIR:C:/dbg" \
            -v "$(cygpath -aw "/${MSYSTEM,,}/bin"):C:/mingw-bin" \
            -v "$(cygpath -aw .):C:/test" \
            $IMAGE pwsh.exe -Command '
              $env:PATH += ";C:\mingw-bin"
              & C:\test\git.exe
              if ($LASTEXITCODE -ne 1) {
                C:\dbg\gflags -i C:\test\git.exe +SLS
                C:\dbg\cdb.exe -c "g" -c "q" C:\test\git.exe
                exit 1
              }
              $git = "C:\test\git.exe"
              & $git -c init.defaultBranch=main init C:\repo
              if ($LASTEXITCODE -ne 0) { exit 1 }
              Set-Location C:\repo
              Set-Content -Path f -Value one
              & $git add f
              if ($LASTEXITCODE -ne 0) { exit 1 }
              Set-Content -Path f -Value two
              $out = & $git status --porcelain
              Write-Output "status: [$out]"
              if ($LASTEXITCODE -ne 0 -or "$out" -ne "AM f") { exit 1 }
              exit 0
            '
