name: CI

on: [push]

jobs:
  slices:
    name: time each test of a stalled slice (${{ matrix.ref }}, slice ${{ matrix.slice }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: changetime-ctime-v4-c2
            slice: 1
          - ref: changetime-ctime-v3-ci
            slice: 7
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ matrix.ref }}
    - uses: git-for-windows/setup-git-for-windows-sdk@v2
    - name: build
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: . /etc/profile && make -j$NUMBER_OF_PROCESSORS NO_RUST=1 >/dev/null && git log -1 --format='%h %s'
    - name: run the slice as CI does
      timeout-minutes: 30
      shell: bash
      env:
        HOME: ${{ runner.workspace }}
      run: |
        . /etc/profile
        export DEFAULT_TEST_TARGET=prove GIT_TEST_CLONE_2GB=true
        export GIT_PROVE_OPTS='--timer --jobs 10'
        export GIT_TEST_OPTS='--verbose-log -x --no-chain-lint --no-bin-wrappers'
        (cd t && ./helper/test-tool path-utils slice-tests ${{ matrix.slice }} 10 t[0-9]*.sh) >/tmp/tests.txt
        echo "$(wc -l </tmp/tests.txt) tests"
        make --quiet -C t T="$(tr '\n' ' ' </tmp/tests.txt)" >/tmp/prove.txt 2>&1
    - name: report, also after a timeout
      if: always()
      shell: bash
      run: |
        . /etc/profile
        echo "finished: $(grep -cE '^\[[0-9:]+\] t[0-9]' /tmp/prove.txt) of $(wc -l </tmp/tests.txt)"
        echo "slowest:"
        grep -E '^\[[0-9:]+\] t[0-9]' /tmp/prove.txt | sed -n 's/^.* \([0-9][0-9]*\) ms .*$/\1 &/p' | sort -n | tail -5
        echo "did not finish:"
        while read -r t; do grep -q "\] $t " /tmp/prove.txt || echo "  $t"; done </tmp/tests.txt
        echo "failures:"
        grep -E 'Dubious|Failed|not ok' /tmp/prove.txt | head -20 || echo "  none"
        tail -4 /tmp/prove.txt
